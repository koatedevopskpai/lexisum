name: offline-core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only offline-core dependencies
        run: python -m pip install -r requirements-offline.lock
      - name: Parse, extract, audit, export and account for usage offline
        run: python -m pytest -c pytest-offline.ini --junitxml=artifacts/offline-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-core-${{ github.sha }}
          path: artifacts/offline-results.xml
